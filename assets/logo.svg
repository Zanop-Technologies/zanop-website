<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4635A"/>
      <stop offset="100%" stop-color="#F5A15A"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26B4A"/>
      <stop offset="100%" stop-color="#F0904A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A6B"/>
      <stop offset="60%" stop-color="#1849A8"/>
      <stop offset="100%" stop-color="#2B6FD4"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5FC2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7FB4F5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123E8F" stop-opacity="0"/>
      <stop offset="55%" stop-color="#4E8FE0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#CFE4FF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="600" cy="800" rx="430" ry="45" fill="url(#shadowGrad)"/>

  <!-- kickstand -->
  <path d="M 330 720 L 620 560 L 700 750 L 470 800 Z" fill="url(#standGrad)"/>

  <!-- tablet frame (tilted) -->
  <g transform="rotate(-8 600 460)">
    <rect x="260" y="180" width="720" height="560" rx="34" fill="url(#frameGrad)"/>
    <rect x="292" y="212" width="656" height="450" rx="16" fill="url(#screenGrad)"/>

    <!-- wave streaks -->
    <path d="M 300 560 C 480 470, 620 380, 940 260" stroke="url(#wave2)" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 300 610 C 500 520, 660 420, 940 320" stroke="url(#wave1)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 320 500 C 500 440, 640 340, 900 230" stroke="url(#wave1)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- app icon grid, top-left -->
    <g>
      <rect x="330" y="248" width="34" height="34" rx="9" fill="#F0A050"/>
      <rect x="374" y="248" width="34" height="34" rx="9" fill="#3D7CD6"/>
      <rect x="330" y="292" width="34" height="34" rx="9" fill="#3D7CD6"/>
      <rect x="374" y="292" width="34" height="34" rx="9" fill="#F0A050"/>
      <rect x="330" y="336" width="34" height="34" rx="9" fill="#F0A050"/>
      <rect x="374" y="336" width="34" height="34" rx="9" fill="#3D7CD6"/>
    </g>

    <!-- bottom dock bar -->
    <rect x="292" y="612" width="656" height="50" fill="#0A1E4D"/>
    <g>
      <rect x="655" y="626" width="24" height="24" rx="7" fill="#3D7CD6"/>
      <rect x="689" y="626" width="24" height="24" rx="7" fill="#F0A050"/>
      <rect x="723" y="626" width="24" height="24" rx="7" fill="#FFFFFF"/>
      <rect x="757" y="626" width="24" height="24" rx="7" fill="#3D7CD6"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="1010" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="900"
        font-size="150" fill="#111111" letter-spacing="4">
    ZANOP OS
  </text>
</svg>