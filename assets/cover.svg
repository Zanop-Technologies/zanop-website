<svg viewBox="0 0 1640 624" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#F0442E"/>
      <stop offset="35%" stop-color="#F5934F"/>
      <stop offset="70%" stop-color="#FBCBA3"/>
      <stop offset="100%" stop-color="#FDF3EA"/>
    </linearGradient>
    <linearGradient id="waveBand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4635A"/>
      <stop offset="100%" stop-color="#F5A15A"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26B4A"/>
      <stop offset="100%" stop-color="#F0904A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A6B"/>
      <stop offset="60%" stop-color="#1849A8"/>
      <stop offset="100%" stop-color="#2B6FD4"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5FC2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7FB4F5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123E8F" stop-opacity="0"/>
      <stop offset="55%" stop-color="#4E8FE0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#CFE4FF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1640" height="624" fill="url(#bgGrad)"/>

  <!-- decorative background wave bands -->
  <path d="M -50 470 C 300 420, 600 520, 1000 460 C 1300 415, 1500 470, 1690 430 L 1690 624 L -50 624 Z"
        fill="url(#waveBand1)"/>
  <path d="M -50 520 C 350 480, 650 560, 1050 510 C 1350 475, 1550 520, 1690 495 L 1690 624 L -50 624 Z"
        fill="#FFFFFF" opacity="0.10"/>

  <!-- wordmark -->
  <text x="110" y="255" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="900" font-size="92" fill="#141414" letter-spacing="2">
    ZANOP
  </text>
  <text x="110" y="355" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="900" font-size="92" fill="#141414" letter-spacing="2">
    TECHNOLOGIES
  </text>
  <text x="112" y="410" font-family="Arial, Helvetica, sans-serif"
        font-size="30" fill="#1a1a1a">
    Building the future of computing, from scratch.
  </text>

  <!-- ground shadow for device -->
  <ellipse cx="1320" cy="560" rx="320" ry="35" fill="url(#shadowGrad)"/>

  <!-- kickstand -->
  <path d="M 1500 380 L 1600 330 L 1640 430 L 1560 470 Z" fill="url(#standGrad)"/>

  <!-- tablet device, tilted -->
  <g transform="rotate(-8 1300 340)">
    <rect x="1030" y="150" width="580" height="420" rx="26" fill="url(#frameGrad)"/>
    <rect x="1055" y="175" width="530" height="340" rx="12" fill="url(#screenGrad)"/>

    <!-- wave streaks -->
    <path d="M 1065 400 C 1200 340, 1310 270, 1560 190" stroke="url(#wave2)" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 1065 440 C 1220 380, 1340 300, 1560 235" stroke="url(#wave1)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 1080 360 C 1220 315, 1330 245, 1530 170" stroke="url(#wave1)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- app icon grid, top-left -->
    <g>
      <rect x="1080" y="205" width="26" height="26" rx="7" fill="#F0A050"/>
      <rect x="1114" y="205" width="26" height="26" rx="7" fill="#3D7CD6"/>
      <rect x="1080" y="239" width="26" height="26" rx="7" fill="#3D7CD6"/>
      <rect x="1114" y="239" width="26" height="26" rx="7" fill="#F0A050"/>
    </g>

    <!-- bottom dock bar -->
    <rect x="1055" y="475" width="530" height="40" fill="#0A1E4D"/>
    <g>
      <rect x="1330" y="486" width="18" height="18" rx="5" fill="#3D7CD6"/>
      <rect x="1356" y="486" width="18" height="18" rx="5" fill="#F0A050"/>
      <rect x="1382" y="486" width="18" height="18" rx="5" fill="#FFFFFF"/>
      <rect x="1408" y="486" width="18" height="18" rx="5" fill="#3D7CD6"/>
    </g>
  </g>
</svg>